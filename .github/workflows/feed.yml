name: Daily pin feed
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_guides.py
      - run: python3 scripts/build_feed.py
      - run: |
          git config user.name "lumivexa-bot"
          git config user.email "lumivexa-bot@users.noreply.github.com"
          git add -A guides sitemap.xml robots.txt feed*.xml
          git diff --cached --quiet || (git commit -m "Daily guides and pin feed update" && git push)
